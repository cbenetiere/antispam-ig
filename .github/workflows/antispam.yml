name: Antispam
on:
  # Plus de déclencheur planifié : le relais Cloudflare lance ce workflow (workflow_dispatch) seulement quand le Mac de
  # Clément est hors ligne (le Mac fait lui-même son passage toutes les 10 min).
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: antispam
  cancel-in-progress: false
jobs:
  passage:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      META_TOKEN_1: ${{ secrets.META_TOKEN_1 }}
      IG_USER_ID_1: ${{ secrets.IG_USER_ID_1 }}
      META_TOKEN_2: ${{ secrets.META_TOKEN_2 }}
      IG_USER_ID_2: ${{ secrets.IG_USER_ID_2 }}
      ANTISPAM_DOMAINES: ${{ vars.ANTISPAM_DOMAINES }}
      ANTISPAM_LECTURE_SEULE: ${{ vars.ANTISPAM_LECTURE_SEULE }}
    steps:
      - uses: actions/checkout@v4
      - run: python3 passer.py
